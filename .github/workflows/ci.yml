name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: 🛡️ Shield Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Pin npm to match the committed lockfile
        run: npm i -g npm@11.17.0

      - name: Install Python (for Shield Scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: npm ci

      - name: 🛡️ Validate Project
        run: npm run check:ci

      # Note: Skipping check:hud (Shield 3) as it requires a running server
      # We will add the static "The Jig" check here in Phase 2
